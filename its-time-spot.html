<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT'S TIME — Trailer · Spot</title>
<meta property="og:title" content="IT'S TIME — Trailer">
<meta property="og:description" content="El spot de la novela IT'S TIME · Ahora es el momento.">
<style>
  :root{ --bg:#0b1220; --bg2:#0a0f18; --cream:#f1ead8; --amber:#c9a24b; --mut:#9fb0c8; }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(120% 80% at 50% 0%, #12233a 0%, #0b1220 45%, #0a0d13 100%);
       color:var(--cream);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
  .kick{color:var(--amber);letter-spacing:.32em;font-size:13px;font-weight:700;margin:6px 0 2px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:30px;margin:0 0 4px;text-align:center}
  .sub{color:var(--mut);font-size:14px;margin:0 0 18px;text-align:center}
  .wrap{width:100%;max-width:430px}
  video{width:100%;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55);background:#000;display:block}
  .tabs{display:flex;gap:10px;justify-content:center;margin:16px 0}
  .tab{flex:1;max-width:160px;text-align:center;padding:11px 0;border-radius:12px;border:1px solid #2a3a55;
       color:var(--cream);background:#101a2b;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:.15s}
  .tab.active{background:var(--amber);color:#10151d;border-color:var(--amber)}
  .cta{margin-top:22px;text-align:center}
  .cta a{display:inline-block;background:#101a2b;border:1px solid #2a3a55;color:var(--cream);
         padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:700}
  .foot{color:#7f93ad;font-size:12px;letter-spacing:.14em;margin-top:26px;text-align:center}
</style>
</head>
<body>
  <div class="kick">IT'S TIME · TRAILER</div>
  <h1 id="title">Mirá el spot</h1>
  <p class="sub" id="subtitle">La novela de concientización climática.</p>
  <div class="wrap">
    <video id="player" src="SPOT_ITSTIME_ES_video_Moby.mp4" controls playsinline preload="metadata"
           poster="" style="aspect-ratio:9/16;"></video>
    <div class="tabs">
      <a class="tab active" id="btnEs" onclick="setLang('es')">Español</a>
      <a class="tab" id="btnEn" onclick="setLang('en')">English</a>
    </div>
    <div class="cta">
      <a id="ctaLink" href="its-time.html">📖 Adelanto de lectura + precios</a>
    </div>
  </div>
  <div class="foot">BINORD ADVISORY CO. · AHORA ES EL MOMENTO</div>

<script>
  var v=document.getElementById('player');
  var T={es:{title:"Mirá el spot",sub:"La novela de concientización climática.",cta:"📖 Adelanto de lectura + precios",src:"SPOT_ITSTIME_ES_video_Moby.mp4"},
         en:{title:"Watch the trailer",sub:"The climate-awareness novel.",cta:"📖 Reading preview + prices",src:"SPOT_ITSTIME_EN_video_Moby.mp4"}};
  function setLang(l){
    var t=T[l];
    document.documentElement.lang=l;
    document.getElementById('title').textContent=t.title;
    document.getElementById('subtitle').textContent=t.sub;
    document.getElementById('ctaLink').textContent=t.cta;
    document.getElementById('btnEs').classList.toggle('active',l==='es');
    document.getElementById('btnEn').classList.toggle('active',l==='en');
    var wasPlaying=!v.paused; v.src=t.src; v.load(); if(wasPlaying){ v.play().catch(function(){}); }
  }
  // idioma inicial según navegador
  if((navigator.language||'es').slice(0,2)==='en'){ setLang('en'); }
</script>
</body>
</html>
